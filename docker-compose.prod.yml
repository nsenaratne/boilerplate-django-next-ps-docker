# Production-style stack — everything behind nginx on one port.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   (or: make prod-up)
#
#   App    http://localhost          (Next.js)
#   API    http://localhost/api/v1/  (Django via gunicorn)
#   Admin  http://localhost/admin/
#
# Set real secrets in .env before deploying (see .env.example).

name: ${COMPOSE_PROJECT_NAME:-app}-prod

services:
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      target: prod
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-app}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost}
      # nginx is the one trusted proxy; rate limits use the client IP it forwards.
      DRF_NUM_PROXIES: ${DRF_NUM_PROXIES:-1}
      # Behind nginx without TLS locally; set to "true" once TLS terminates in front.
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
    volumes:
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        # Same origin as the page, routed by nginx — no CORS needed.
        NEXT_PUBLIC_API_URL: ${PROD_PUBLIC_API_URL:-/api/v1}
    restart: always
    depends_on:
      - backend

  nginx:
    image: nginx:1.29-alpine
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/static:ro
    depends_on:
      - backend
      - frontend

volumes:
  db_data:
  static_files:
